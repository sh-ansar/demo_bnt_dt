<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BNT — Диспетчерский центр</title>
<link rel="stylesheet" href="/assets/css/tokens.css"><link rel="stylesheet" href="/assets/css/layout.css"><link rel="stylesheet" href="/assets/css/components.css"><link rel="stylesheet" href="/assets/css/pages/dispatcher.css"></head>
<body data-page="dispatcher"><main id="page-content" class="page-content flush">
  <section class="dispatcher-stage">
    <div id="google-map" class="map-surface" hidden></div>
    <div id="fallback-map" class="map-surface fallback-map"><img src="/assets/terminal-map.jpg" alt="Спутниковый снимок терминала"><div id="fallback-overlays"></div><div class="fallback-note"><strong>Демонстрационный спутниковый режим</strong><span>Добавьте Google Maps API key, чтобы включить панорамирование и масштабирование</span></div></div>
    <div class="map-toolbar"><label class="map-search"><span>⌕</span><input id="map-search" placeholder="Н-101, К-24, R-16, склад…"></label><button id="map-reset" class="btn">Весь терминал</button><button id="show-risks" class="btn btn-primary">Показать риски</button><span id="map-mode" class="badge green">Satellite · Demo</span></div>
    <section class="layer-panel"><div class="layer-head"><strong>Слои цифрового двойника</strong><span id="zoom-level">LOD 17</span></div><div id="layer-buttons" class="layer-grid"></div><small id="layer-status">Загрузка слоев…</small></section>
    <div class="map-zoom"><button id="zoom-in" aria-label="Приблизить">+</button><button id="zoom-out" aria-label="Отдалить">−</button></div>
    <section class="map-kpis"><article><span>Доступность</span><strong>92%</strong></article><article><span>Риски</span><strong class="red">7</strong></article><article><span>План приема</span><strong>241K</strong></article><article><span>Вагоны</span><strong>48 / 63</strong></article><article><span>Бюджет ТОиР</span><strong>$241K</strong></article></section>
    <aside id="object-drawer" class="object-drawer" aria-hidden="true"><div class="drawer-head"><div><h2 id="drawer-title">Объект</h2><p id="drawer-subtitle"></p></div><button id="drawer-close" class="icon-btn" aria-label="Закрыть">×</button></div><div id="drawer-body" class="drawer-body"></div></aside>
  </section>
</main><script src="/assets/js/navigation.js"></script><script src="/assets/js/ui.js"></script><script src="/assets/js/data/operations.js"></script><script src="/assets/js/pages/dispatcher.js"></script><script src="/assets/js/shell.js"></script></body></html>
